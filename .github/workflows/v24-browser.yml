name: V24 browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '_config.yml'
      - 'launch/**'
      - 'js/**'
      - 'css/**'
      - 'tests/**'
      - 'supabase/**'
      - 'billing/**'
      - '.github/workflows/v24-browser.yml'
permissions:
  contents: read
jobs:
  mobile-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Screen reachable repository history for credential patterns
        run: node tests/v63-secret-screen.mjs
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.51.1 esbuild@0.25.0
          npx --no-install playwright install --with-deps chromium
      - name: Test isolated AI handler with mock network
        run: node tests/v27-ai-handler.mjs
      - name: Test isolated image handler with mock network
        run: node tests/v28-image-handler.mjs
      - name: Test Etsy authorisation handler using mock network
        run: node tests/v31-etsy-handler.mjs
      - name: Test isolated billing policy (no provider network)
        run: node tests/v38-billing-policy.mjs
      - name: Test read-only Stripe diagnostic with mock network
        run: node tests/v40-stripe-test.mjs
      - name: Test sandbox checkout safety with mock network
        run: node tests/v41-stripe-checkout.mjs
      - name: Test signed sandbox webhooks with mock network
        run: node tests/v42-stripe-webhook.mjs
      - name: Test sandbox access policy with mock network
        run: node tests/v43-sandbox-access.mjs
      - name: Test sandbox billing portal with mock network
        run: node tests/v44-sandbox-portal.mjs
      - name: Test dedicated mobile checkout with mock network
        run: node tests/v46-checkout-page.mjs
      - name: Test dedicated sandbox access page with mock network
        run: node tests/v52-access-page.mjs
      - name: Verify dual-origin backend compatibility with mock network
        run: node tests/v121-host-origins.mjs
      - name: Test local keyword discovery engine
        run: node tests/v57-keyword-discovery.mjs
      - name: Test local competitor comparison engine
        run: node tests/v58-competitor-comparison.mjs
      - name: Test local listing action plan
        run: node tests/v59-listing-plan.mjs
      - name: Test local shop assistant
        run: node tests/v60-shop-assistant.mjs
      - name: Test marketplace approval and operator gates without network
        run: node tests/v65-marketplace-access.mjs
      - name: Test isolated Google demand research with mock network
        run: node tests/v67-google-demand.mjs
      - name: Test local Google demand intelligence
        run: node tests/v68-demand-intelligence.mjs
      - name: Run browser regression using only mock data
        run: node tests/v24-browser.mjs
      - name: Build V107 isolated offline preview
        run: node tests/v107-build-preview.mjs
      - name: Verify offline preview on desktop and mobile
        run: node tests/v107-preview-browser.mjs
      - name: Package owner offline preview
        if: github.head_ref == 'overnight-v70-v79'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SellerPilot-V106-offline-preview
          path: preview-output/
          retention-days: 7
          if-no-files-found: error
      - name: Prepare candidate package and release evidence locally
        if: github.head_ref == 'overnight-v70-v79'
        env:
          SELLERPILOT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export SELLERPILOT_CHECKOUT_SHA="$(git rev-parse HEAD)"
          node tests/v119-release-manifest.mjs "$RUNNER_TEMP/sellerpilot-frontend" "$RUNNER_TEMP/sellerpilot-release-evidence"
      - name: Retain candidate release evidence only (no hosted preview or deployment)
        if: github.head_ref == 'overnight-v70-v79'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SellerPilot-release-evidence
          path: ${{ runner.temp }}/sellerpilot-release-evidence/manifest.json
          retention-days: 7
          if-no-files-found: error
