name: V24 browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'launch/**'
      - 'js/**'
      - 'css/**'
      - 'tests/**'
      - 'supabase/**'
      - 'billing/**'
      - '.github/workflows/v24-browser.yml'
permissions:
  contents: read
jobs:
  mobile-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.51.1
          npx --no-install playwright install --with-deps chromium
      - name: Test isolated AI handler with mock network
        run: node tests/v27-ai-handler.mjs
      - name: Test isolated image handler with mock network
        run: node tests/v28-image-handler.mjs
      - name: Test Etsy authorisation handler using mock network
        run: node tests/v31-etsy-handler.mjs
      - name: Test isolated billing policy (no provider network)
        run: node tests/v38-billing-policy.mjs
      - name: Test read-only Stripe diagnostic with mock network
        run: node tests/v40-stripe-test.mjs
      - name: Test sandbox checkout safety with mock network
        run: node tests/v41-stripe-checkout.mjs
      - name: Test signed sandbox webhooks with mock network
        run: node tests/v42-stripe-webhook.mjs
      - name: Test sandbox access policy with mock network
        run: node tests/v43-sandbox-access.mjs
      - name: Test sandbox billing portal with mock network
        run: node tests/v44-sandbox-portal.mjs
      - name: Test dedicated mobile checkout with mock network
        run: node tests/v46-checkout-page.mjs
      - name: Test dedicated sandbox access page with mock network
        run: node tests/v52-access-page.mjs
      - name: Test local keyword discovery engine
        run: node tests/v57-keyword-discovery.mjs
      - name: Test local competitor comparison engine
        run: node tests/v58-competitor-comparison.mjs
      - name: Test local listing action plan
        run: node tests/v59-listing-plan.mjs
      - name: Test local shop assistant
        run: node tests/v60-shop-assistant.mjs
      - name: Run browser regression using only mock data
        run: node tests/v24-browser.mjs
