<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Etsy authorisation return</title></head><body><p id="message">Returning to SellerPilot…</p><script>try{const u=new URL(location.href),state=u.searchParams.get('state'),code=u.searchParams.get('code');history.replaceState(null,'',location.pathname);sessionStorage.removeItem('sellerpilot-etsy-return');if(/^[a-f0-9]{64}$/.test(state||'')&&code&&code.length<=2048){sessionStorage.setItem('sellerpilot-etsy-return',JSON.stringify({state,code,at:Date.now()}))}else{sessionStorage.setItem('sellerpilot-etsy-return',JSON.stringify({cancelled:true,at:Date.now()}))}location.replace('./index.html')}catch{document.getElementById('message').textContent='Could not finish authorisation. Return to SellerPilot and try again.'}</script><p><a href="./index.html" rel="noreferrer">Return to SellerPilot</a></p></body></html>
